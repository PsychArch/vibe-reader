[project]
name = "vibe-reader"
version = "0.2.1"
description = "E-ink friendly web reader for tmux panes, project files, Markdown, and git diffs."
readme = "README.md"
authors = [
    { name = "PsychArch", email = "PsychArch@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.140.13",
    "libtmux==0.62.0",
    "uvicorn==0.51.0",
    "Pygments==2.20.0",
    "markdown==3.10.2",
    "dulwich==1.2.12",
    "pydantic==2.13.4",
]

[project.scripts]
vibe-reader = "backend.main:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"frontend" = "frontend"
